<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dina — استودیوی محتوا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --panel:#ffffff; --panel2:#f2f0ea; --line:#e5e1d8;
  --ink:#15181f; --ink-dim:#6b6f78; --navy:#1c2540; --silver:#b9bcc4;
  --rose:#d94f70; --teal:#2f8f88; --amber:#d99a2b; --indigo:#5b52c9;
}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111319; --panel:#181b23; --panel2:#20232c; --line:#2a2e38; --ink:#f1f0ec; --ink-dim:#9a9ea8;
}}
:root[data-theme="dark"]{--bg:#111319; --panel:#181b23; --panel2:#20232c; --line:#2a2e38; --ink:#f1f0ec; --ink-dim:#9a9ea8;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{padding:22px 28px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;
  padding-top:calc(22px + env(safe-area-inset-top,0px));}
.brand{font-size:23px;font-weight:800;letter-spacing:.2px;color:var(--navy);}
.brand span{color:var(--ink-dim);font-weight:400;font-size:14px;}
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;overflow-x:auto;}
.tab{padding:8px 16px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--ink-dim);white-space:nowrap;}
.tab.active{background:var(--navy);color:#fff;font-weight:600;border-color:var(--navy);}
main{padding:24px 28px 60px;max-width:1150px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;}
h2{font-size:15.5px;font-weight:700;margin:0 0 14px;color:var(--navy);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:3px solid var(--c,var(--navy));}
.kpi .n{font-size:20px;font-weight:800;}
.kpi .l{color:var(--ink-dim);font-size:11.5px;margin-top:4px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 10px;font-family:'Vazirmatn',sans-serif;font-size:12.5px;outline:none;width:100%;}
select:focus,input:focus,textarea:focus{border-color:var(--navy);}
button{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;
  font-size:12.5px;cursor:pointer;font-family:'Vazirmatn',sans-serif;}
button.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);padding:7px 12px;font-weight:500;}
button.chip{background:var(--panel2);color:var(--ink);border:1px solid var(--line);}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);}
th{color:var(--ink-dim);font-weight:600;font-size:11px;}
.pillbtn{color:var(--ink-dim);cursor:pointer;padding:2px 6px;}
.pillbtn:hover{color:var(--navy);}
.pillbtn.del:hover{color:var(--rose);}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;color:#fff;font-weight:600;}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.note{color:var(--ink-dim);font-size:11.5px;line-height:1.8;}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;}
.bar-label{width:110px;font-size:11.5px;color:var(--ink-dim);flex-shrink:0;}
.bar-track{flex:1;background:var(--panel2);border-radius:6px;height:14px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;}
.bar-val{width:56px;text-align:left;font-size:11px;color:var(--ink-dim);}
.chatline{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:12.5px;line-height:1.8;}
.chatline.q{background:var(--navy);color:#fff;}
.chatline.a{background:var(--panel2);white-space:pre-line;}
@media(max-width:760px){ .two{grid-template-columns:1fr;} main{padding:16px 14px;} header{padding:16px 14px 12px;} }
</style>
</head>
<body>
<header>
  <div class="brand">Dina <span>— استودیوی محتوا و آنالیز اینستاگرام</span></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>

<script>
const PILLARS = [
  {id:'identity',label:'هویت مد',color:'var(--rose)'},
  {id:'styling',label:'استایل',color:'var(--teal)'},
  {id:'research',label:'تحقیق مد',color:'var(--amber)'},
  {id:'designer',label:'هویت طراح',color:'var(--indigo)'}
];
const FORMATS = ['ریلز','کروسل','عکس','استوری','لایو'];
const STATUSES = ['ایده','برنامه‌ریزی‌شده','فیلمبرداری','تدوین','زمان‌بندی‌شده','منتشر شده'];
const AFIELDS_PRIMARY = [
  ['reach','ریچ'],['views','ویو'],['likes','لایک'],['comments','کامنت'],
  ['shares','اشتراک‌گذاری'],['saves','ذخیره'],['profileVisits','بازدید پروفایل'],['follows','فالوور جدید']
];
const AFIELDS_SECONDARY = [
  ['engaged','اکانت‌های درگیر'],
  ['watchTime','مجموع زمان تماشا (ثانیه)'],['avgWatchTime','میانگین زمان تماشا (ثانیه)'],['completionRate','نرخ تکمیل (٪)'],
  ['followerReach','ریچ فالوورها'],['nonFollowerReach','ریچ غیرفالوورها'],['duration','مدت (ثانیه)'],
  ['postingTimeActual','ساعت واقعی انتشار'],['caption','کپشن'],['audio','صدا/آهنگ'],['hashtags','هشتگ‌ها']
];
const AFIELDS = AFIELDS_PRIMARY.concat(AFIELDS_SECONDARY);

function pill(id){ return PILLARS.find(p=>p.id===id)||PILLARS[0]; }
function uid(){ return 'c'+Math.random().toString(36).slice(2,9); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function num(n){ return Number(n||0).toLocaleString('fa-IR'); }

let DATA = {};
try{ DATA = JSON.parse(localStorage.getItem('dina-studio')||'{}'); }catch(e){ DATA={}; }
function save(){ try{ localStorage.setItem('dina-studio', JSON.stringify(DATA)); }catch(e){} }

if(!DATA.content){
  const seed = [
    [1,'ریلز','identity','ترند مد در برابر فد مد','ایده'],[2,'استوری','identity','نظرسنجی: ترند یا فد؟','ایده'],
    [3,'ریلز','identity','۳ اشتباهی که ست شما را ارزان نشان می‌دهد','ایده'],[4,'کروسل','identity','چرخه مد در ۵ مرحله','ایده'],
    [5,'ریلز','identity','یک شلوار، ۳ ست متفاوت','ایده'],[6,'استوری','identity','پشت‌صحنه انتخاب لباس','ایده'],
    [7,'ریلز','identity','چرا وارد دنیای مد شدم','ایده'],
    [8,'ریلز','styling','چطور یک ست را لوکس‌تر نشان دهیم','ایده'],[9,'استوری','styling','نظرسنجی مخاطبان','ایده'],
    [10,'ریلز','styling','۵ ترکیب رنگ بی‌زمان','ایده'],[11,'کروسل','styling','الگانت در برابر کلاسیک، مینیمال و الد مانی','ایده'],
    [12,'ریلز','styling','یک ست، ۳ کفش متفاوت','ایده'],[13,'استوری','styling','نظرسنجی ست پیشنهادی مخاطب','ایده'],
    [14,'ریلز','styling','گریم آر می با توضیح استایلینگ','ایده'],
    [15,'ریلز','research','چطور یک رانوی را تحلیل کنیم','ایده'],[16,'کروسل','research','تحلیل برند: سیلوئت، رنگ، پارچه، استایلینگ','ایده'],
    [17,'ریلز','research','چطور یک ترند مهم را تشخیص دهیم','ایده'],[18,'ریلز','research','از رانوی تا استریت‌استایل','ایده'],
    [19,'استوری','research','پشت‌صحنه اخبار مد','ایده'],[20,'ریلز','research','ساخت مودبورد کالکشن مد','ایده'],
    [21,'استوری','research','جمع‌بندی هفته','ایده'],
    [22,'ریلز','designer','تایم‌لپس طراحی مد در پروکریت','ایده'],[23,'ریلز','designer','از ایده تا طراحی لباس','ایده'],
    [24,'کروسل','designer','طرح → پارچه → لوک نهایی','ایده'],[25,'ریلز','designer','اگر مدیر خلاق این برند بودم','ایده'],
    [26,'استوری','designer','پشت‌صحنه طراحی','ایده'],[27,'ریلز','designer','ارتباط استایل و آرایش','ایده'],
    [28,'استوری','designer','جمع‌بندی','ایده'],[29,'ریلز','designer','این ماه چه چیزی درباره مد یاد گرفتم','ایده'],
    [30,'ریلز','designer','گزارش ماهانه دینا','ایده']
  ];
  DATA.content = seed.map(([day,format,pillar,topic])=>({
    id:uid(), day, format, pillar, topic, hook:topic, cta:'دنبال کن برای ادامه',
    status:'ایده', plannedTime:'19:00', actualTime:'', notes:'', analytics:null
  }));
  DATA.experiments = [];
  save();
}

let tab='dash', filters={pillar:'همه',format:'همه',status:'همه',q:''};
let editingId=null, draft=null, analyticsId=null, expEditingId=null;
const TABS=[{id:'dash',l:'داشبورد'},{id:'calendar',l:'تقویم و آنالیز'},{id:'best',l:'بهترین‌ها'},
  {id:'intel',l:'تحلیل و گزارش'},{id:'assistant',l:'دستیار دینا'},{id:'exp',l:'آزمایش‌ها'}];

function renderTabs(){ document.getElementById('tabs').innerHTML = TABS.map(t=>
  `<div class="tab ${t.id===tab?'active':''}" onclick="setTab('${t.id}')">${t.l}</div>`).join(''); }
function setTab(id){ tab=id; render(); }
function render(){
  renderTabs();
  const m=document.getElementById('main');
  if(tab==='dash') m.innerHTML=dashView();
  else if(tab==='calendar') m.innerHTML=calendarView();
  else if(tab==='best') m.innerHTML=bestView();
  else if(tab==='intel') m.innerHTML=reportView()+intelView();
  else if(tab==='assistant') m.innerHTML=assistantView();
  else if(tab==='exp') m.innerHTML=expView();
}

function filtered(){
  return DATA.content.filter(c=>
    (filters.pillar==='همه'||c.pillar===filters.pillar) &&
    (filters.format==='همه'||c.format===filters.format) &&
    (filters.status==='همه'||c.status===filters.status) &&
    (!filters.q || c.topic.includes(filters.q)||(c.notes||'').includes(filters.q)));
}
function withAnalytics(){ return DATA.content.filter(c=>c.analytics); }

function accountAvg(){
  const list=withAnalytics(); const keys=['views','reach','saves','likes','comments','shares','profileVisits','follows'];
  const avg={}; keys.forEach(k=>{ avg[k]= list.length? list.reduce((a,c)=>a+Number(c.analytics[k]||0),0)/list.length : 0; });
  return avg;
}
function score(c,avg){
  if(!c.analytics) return 0;
  const keys=['views','saves','shares','comments','profileVisits','follows'];
  const ratios=keys.map(k=> avg[k]? Number(c.analytics[k]||0)/avg[k] : 0);
  return ratios.reduce((a,b)=>a+b,0)/keys.length;
}

function filterBar(){
  return `<div class="filters">
    <select onchange="filters.pillar=this.value;render()">
      <option ${filters.pillar==='همه'?'selected':''}>همه</option>
      ${PILLARS.map(p=>`<option ${filters.pillar===p.id?'selected':''} value="${p.id}">${p.label}</option>`).join('')}
    </select>
    <select onchange="filters.format=this.value;render()">
      <option ${filters.format==='همه'?'selected':''}>همه</option>
      ${FORMATS.map(f=>`<option ${filters.format===f?'selected':''}>${f}</option>`).join('')}
    </select>
    <select onchange="filters.status=this.value;render()">
      <option ${filters.status==='همه'?'selected':''}>همه</option>
      ${STATUSES.map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <input type="text" placeholder="جست‌وجوی موضوع…" style="max-width:180px" value="${esc(filters.q)}" oninput="filters.q=this.value;render()">
  </div>`;
}

function barRows(items){
  const max=Math.max(...items.map(i=>i.v),1);
  return items.map(i=>`<div class="bar-row"><div class="bar-label">${i.label}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${(i.v/max*100).toFixed(1)}%;background:${i.color||'var(--navy)'}"></div></div>
    <div class="bar-val">${num(i.v)}</div></div>`).join('');
}

function dashView(){
  const list=withAnalytics();
  const sum=k=>list.reduce((a,c)=>a+Number(c.analytics[k]||0),0);
  const totals={posts:DATA.content.filter(c=>c.status==='منتشر شده').length, reach:sum('reach'), views:sum('views'),
    likes:sum('likes'), saves:sum('saves'), shares:sum('shares'), comments:sum('comments'),
    profileVisits:sum('profileVisits'), follows:sum('follows')};
  const reelViews=list.filter(c=>c.format==='ریلز').map(c=>Number(c.analytics.views||0));
  const avgReelViews=reelViews.length? reelViews.reduce((a,b)=>a+b,0)/reelViews.length:0;
  const avgWatch=list.length? sum('watchTime')/list.length:0;
  const avgEng=totals.reach? ((totals.likes+totals.comments+totals.saves+totals.shares)/totals.reach*100):0;
  const byPillar=PILLARS.map(p=>({label:p.label,color:p.color,v:list.filter(c=>c.pillar===p.id).reduce((a,c)=>a+Number(c.analytics.reach||0),0)}));
  const byFormat=FORMATS.map(f=>({label:f,v:list.filter(c=>c.format===f).reduce((a,c)=>a+Number(c.analytics.views||0),0)}));
  return `
  <div class="kpis">
    <div class="kpi" style="--c:var(--navy)"><div class="n">${num(totals.posts)}</div><div class="l">پست منتشرشده</div></div>
    <div class="kpi" style="--c:var(--rose)"><div class="n">${num(totals.reach)}</div><div class="l">مجموع ریچ</div></div>
    <div class="kpi" style="--c:var(--teal)"><div class="n">${num(totals.views)}</div><div class="l">مجموع ویو</div></div>
    <div class="kpi" style="--c:var(--amber)"><div class="n">${num(totals.follows)}</div><div class="l">فالوور از محتوا</div></div>
    <div class="kpi" style="--c:var(--indigo)"><div class="n">${num(Math.round(avgReelViews))}</div><div class="l">میانگین ویو ریلز</div></div>
    <div class="kpi" style="--c:var(--navy)"><div class="n">${avgEng.toFixed(1)}٪</div><div class="l">نرخ تعامل</div></div>
  </div>
  <div class="note" style="margin-bottom:16px;">جزئیات بیشتر (لایک، ذخیره، اشتراک‌گذاری، کامنت، بازدید پروفایل، میانگین زمان تماشا) در تب «بهترین‌ها» و «تحلیل و گزارش».</div>
  <div class="two">
    <div class="card"><h2>ریچ بر اساس پیلار محتوا</h2>${list.length?barRows(byPillar):`<div class="note">هنوز داده‌ی آنالیزی ثبت نشده. از تب «تقویم محتوا» برای هر پست منتشرشده آنالیز وارد کنید.</div>`}</div>
    <div class="card"><h2>ویو بر اساس فرمت</h2>${list.length?barRows(byFormat):`<div class="note">داده‌ای موجود نیست.</div>`}</div>
  </div>
  <div class="card"><h2>یادداشت</h2><div class="note">داشبورد فعلاً با داده‌ی دستی کار می‌کند. ساختار داده طوری طراحی شده که بعداً می‌توان API اینستاگرام را برای پرشدن خودکار آنالیزها وصل کرد.</div></div>`;
}

function calendarView(){
  const rows=filtered().slice().sort((a,b)=>a.day-b.day);
  const e = editingId? DATA.content.find(c=>c.id===editingId) : null;
  const d = e || draft || {day:1,format:'ریلز',pillar:'identity',topic:'',hook:'',cta:'',status:'ایده',plannedTime:'19:00',actualTime:'',notes:''};
  const an = analyticsId? DATA.content.find(c=>c.id===analyticsId) : null;
  return `
  <details class="card" ${e?'open':''}>
    <summary class="note" style="cursor:pointer;font-weight:700;color:var(--navy);font-size:14.5px;">${e?'ویرایش محتوا':'+ افزودن محتوا جدید'}</summary>
    <div class="formgrid" style="margin-top:12px;">
      <div><label class="note">روز ماه</label><input type="number" id="f-day" min="1" max="31" value="${d.day}"></div>
      <div><label class="note">فرمت</label><select id="f-format">${FORMATS.map(f=>`<option ${d.format===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div><label class="note">پیلار محتوا</label><select id="f-pillar">${PILLARS.map(p=>`<option value="${p.id}" ${d.pillar===p.id?'selected':''}>${p.label}</option>`).join('')}</select></div>
      <div><label class="note">موضوع</label><input type="text" id="f-topic" value="${esc(d.topic)}"></div>
    </div>
    <details style="margin-bottom:12px;">
      <summary class="note" style="cursor:pointer;">جزئیات بیشتر (وضعیت، زمان‌بندی، هوک، CTA، یادداشت)</summary>
      <div class="formgrid" style="margin-top:10px;">
        <div><label class="note">وضعیت</label><select id="f-status">${STATUSES.map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label class="note">ساعت برنامه‌ریزی‌شده</label><input type="text" id="f-ptime" value="${esc(d.plannedTime)}"></div>
        <div><label class="note">ساعت واقعی انتشار</label><input type="text" id="f-atime" value="${esc(d.actualTime)}"></div>
        <div><label class="note">هوک</label><input type="text" id="f-hook" value="${esc(d.hook)}"></div>
        <div><label class="note">CTA</label><input type="text" id="f-cta" value="${esc(d.cta)}"></div>
        <div><label class="note">یادداشت</label><input type="text" id="f-notes" value="${esc(d.notes)}"></div>
      </div>
    </details>
    <button onclick="saveContent()">${e?'ذخیره تغییرات':'افزودن به تقویم'}</button>
    ${e?`<button class="ghost" onclick="editingId=null;render()">انصراف</button>`:''}
  </details>
  ${an?analyticsForm(an):''}
  <div class="card">
    <h2>تقویم محتوا (${rows.length})</h2>
    ${filterBar()}
    <table><tr><th>روز</th><th>پیلار</th><th>موضوع</th><th>وضعیت</th><th>آنالیز</th><th></th></tr>
    ${rows.map(c=>`<tr>
      <td>${c.day}</td><td><span class="tag" style="background:${pill(c.pillar).color}">${pill(c.pillar).label}</span></td>
      <td>${esc(c.topic)}<div class="note">${c.format}</div></td><td>${c.status}</td>
      <td>${c.analytics?'ثبت‌شده ✓':`<span class="pillbtn" onclick="analyticsId='${c.id}';render()">ثبت آنالیز</span>`}</td>
      <td><span class="pillbtn" onclick="editingId='${c.id}';render()">✎</span> <span class="pillbtn del" onclick="delContent('${c.id}')">✕</span></td>
    </tr>`).join('')}</table>
    ${!rows.length?`<div class="note">موردی یافت نشد.</div>`:''}
  </div>`;
}
function analyticsForm(c){
  const a=c.analytics||{};
  return `<div class="card"><h2>ثبت آنالیز — ${esc(c.topic)}</h2>
    <div class="formgrid">${AFIELDS_PRIMARY.map(([k,l])=>`<div><label class="note">${l}</label><input type="text" id="a-${k}" value="${esc(a[k])}"></div>`).join('')}</div>
    <details>
      <summary class="note" style="cursor:pointer;">آمار تکمیلی (زمان تماشا، ریچ فالوور/غیرفالوور، کپشن، هشتگ و…)</summary>
      <div class="formgrid" style="margin-top:10px;">${AFIELDS_SECONDARY.map(([k,l])=>`<div><label class="note">${l}</label><input type="text" id="a-${k}" value="${esc(a[k])}"></div>`).join('')}</div>
    </details>
    <div style="margin-top:10px;"><button onclick="saveAnalytics('${c.id}')">ذخیره آنالیز</button>
    <button class="ghost" onclick="analyticsId=null;render()">بستن</button></div>
  </div>`;
}
function saveAnalytics(id){
  const c=DATA.content.find(x=>x.id===id); const a={};
  AFIELDS.forEach(([k])=>{ a[k]=document.getElementById('a-'+k).value; });
  c.analytics=a; if(c.status!=='منتشر شده') c.status='منتشر شده';
  analyticsId=null; save(); render();
}
function saveContent(){
  const day=Number(document.getElementById('f-day').value);
  if(!day||day<1||day>31){ alert('روز نامعتبر است.'); return; }
  const obj={day, format:document.getElementById('f-format').value, pillar:document.getElementById('f-pillar').value,
    status:document.getElementById('f-status').value, plannedTime:document.getElementById('f-ptime').value,
    actualTime:document.getElementById('f-atime').value, topic:document.getElementById('f-topic').value,
    hook:document.getElementById('f-hook').value, cta:document.getElementById('f-cta').value, notes:document.getElementById('f-notes').value};
  if(editingId){ const c=DATA.content.find(x=>x.id===editingId); Object.assign(c,obj); editingId=null; }
  else{ DATA.content.push({id:uid(), analytics:null, ...obj}); }
  draft=null; save(); render();
}
function delContent(id){ DATA.content=DATA.content.filter(c=>c.id!==id); save(); render(); }

function bestView(){
  const list=withAnalytics(); const avg=accountAvg();
  const ranked=list.map(c=>({c,s:score(c,avg)})).sort((a,b)=>b.s-a.s);
  const by=(k)=> list.slice().sort((a,b)=>Number(b.analytics[k]||0)-Number(a.analytics[k]||0))[0];
  const cats=[['views','بیشترین ویو'],['saves','بیشترین ذخیره'],['shares','بیشترین اشتراک‌گذاری'],
    ['comments','بیشترین کامنت'],['profileVisits','بیشترین بازدید پروفایل'],['follows','بیشترین فالوور جذب‌شده']];
  return `
  ${!list.length?`<div class="card"><div class="note">هنوز آنالیزی ثبت نشده. از تقویم محتوا آنالیز پست‌ها را وارد کنید.</div></div>`:`
  <div class="kpis">
    ${cats.map(([k,l])=>{ const top=by(k); return `<div class="kpi"><div class="n" style="font-size:14px">${top?esc(top.topic):'—'}</div><div class="l">${l}${top?' — '+num(top.analytics[k]):''}</div></div>`; }).join('')}
  </div>
  <div class="card"><h2>امتیاز عملکرد محتوا (نسبت به میانگین اکانت شما)</h2>
    <div class="note" style="margin-bottom:8px;">این امتیاز یک الگوریتم رسمی اینستاگرام نیست — فقط نسبت عملکرد هر پست به میانگین تاریخی خودِ اکانت شماست.</div>
    <table><tr><th>موضوع</th><th>پیلار</th><th>فرمت</th><th>امتیاز</th></tr>
    ${ranked.slice(0,10).map(r=>`<tr><td>${esc(r.c.topic)}</td><td>${pill(r.c.pillar).label}</td><td>${r.c.format}</td><td><b>${r.s.toFixed(2)}×</b></td></tr>`).join('')}
    </table>
  </div>`}`;
}

function intelPatterns(){
  const list=withAnalytics(); if(!list.length) return [];
  const avg=k=> list.reduce((a,c)=>a+Number(c.analytics[k]||0),0)/list.length;
  const out=[];
  ['saves','reach','follows'].forEach(metric=>{
    const groups=PILLARS.map(p=>{ const g=list.filter(c=>c.pillar===p.id); if(!g.length) return null;
      return {label:p.label, v: g.reduce((a,c)=>a+Number(c.analytics[metric]||0),0)/g.length}; }).filter(Boolean);
    if(groups.length<2) return;
    groups.sort((a,b)=>b.v-a.v);
    const overall=avg(metric); if(!overall) return;
    const ratio=groups[0].v/overall;
    const names={saves:'ذخیره',reach:'ریچ',follows:'فالوور جدید'};
    out.push(`محتوای پیلار «${groups[0].label}» به‌طور میانگین ${ratio.toFixed(1)}× بیشتر از میانگین اکانت شما، ${names[metric]} تولید کرده است.`);
  });
  const fg=FORMATS.map(f=>{ const g=list.filter(c=>c.format===f); if(!g.length) return null;
    return {label:f, v:g.reduce((a,c)=>a+Number(c.analytics.reach||0),0)/g.length}; }).filter(Boolean).sort((a,b)=>b.v-a.v);
  if(fg.length>1){ const overall=avg('reach'); if(overall) out.push(`فرمت «${fg[0].label}» بیشترین ریچ را نسبت به میانگین اکانت شما دارد (${(fg[0].v/overall).toFixed(1)}×).`); }
  return out;
}
function intelView(){
  const patterns=intelPatterns();
  return `<div class="card"><h2>الگوهای عملکرد محتوا</h2>
  ${patterns.length?patterns.map(p=>`<div class="note" style="margin-bottom:8px;padding-right:10px;border-right:3px solid var(--indigo);">${p}</div>`).join(''):`<div class="note">برای شناسایی الگو، حداقل چند پست با آنالیز ثبت‌شده نیاز است.</div>`}
  <div class="note" style="margin-top:10px;">همه‌ی مقایسه‌ها نسبت به میانگین تاریخی اکانت خودتان است، نه یک فرمول عمومی اینستاگرام.</div>
  </div>`;
}

function assistantView(){
  const qs=['۵ پست برتر من کدامند؟','چه نوع محتوایی بیشترین فالوور را آورده؟','۱۰ ایده محتوایی بر اساس بهترین پست‌هایم بده',
    '۷ پست بعدی‌ام را پیشنهاد بده','کدام پیلار محتوایی را بیشتر ادامه بدهم؟','چرا رشد این ماه کند شد؟'];
  window._chat = window._chat || [];
  return `<div class="card"><h2>دستیار محتوای دینا</h2>
  <div class="note" style="margin-bottom:10px;">پاسخ‌ها بر اساس داده‌های واقعی همین حساب محاسبه می‌شوند (نه یک مدل زبانی زنده).</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">${qs.map(q=>`<button class="chip" onclick="askDina('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('')}</div>
  <div id="chatbox">${window._chat.map(c=>`<div class="chatline q">${esc(c.q)}</div><div class="chatline a">${esc(c.a)}</div>`).join('')}</div>
  </div>`;
}
function askDina(q){
  const list=withAnalytics(); const avg=accountAvg();
  let a='داده‌ی کافی برای این تحلیل هنوز ثبت نشده.';
  if(list.length){
    const ranked=list.map(c=>({c,s:score(c,avg)})).sort((a,b)=>b.s-a.s);
    if(q.includes('۵ پست برتر')) a=ranked.slice(0,5).map((r,i)=>`${i+1}. ${r.c.topic} (${r.s.toFixed(2)}× میانگین)`).join('\n');
    else if(q.includes('فالوور را آورده')){ const g=PILLARS.map(p=>({p,v:list.filter(c=>c.pillar===p.id).reduce((a,c)=>a+Number(c.analytics.follows||0),0)})).sort((a,b)=>b.v-a.v)[0]; a=`محتوای پیلار «${g.p.label}» بیشترین فالوور را جذب کرده (${num(g.v)} فالوور).`; }
    else if(q.includes('۱۰ ایده')){ const top=ranked[0].c; a=Array.from({length:10},(_,i)=>`ایده ${i+1}: ادامه‌ی موضوع «${top.topic}» با زاویه‌ی جدید در قالب ${FORMATS[i%FORMATS.length]}`).join('\n'); }
    else if(q.includes('۷ پست بعدی')){ const remaining=DATA.content.filter(c=>c.status!=='منتشر شده').slice(0,7); a=remaining.length?remaining.map((c,i)=>`${i+1}. روز ${c.day} — ${c.topic} (${c.format})`).join('\n'):'همه‌ی محتوای برنامه‌ریزی‌شده منتشر شده — زمان برنامه‌ریزی ماه بعد است.'; }
    else if(q.includes('کدام پیلار')){ const g=PILLARS.map(p=>({p,v:score({analytics:{views:list.filter(c=>c.pillar===p.id).reduce((a,c)=>a+Number(c.analytics.views||0),0)}},avg)})); const top=PILLARS.map(p=>{const gg=list.filter(c=>c.pillar===p.id); return {p,avgS:gg.length?gg.reduce((a,c)=>a+score(c,avg),0)/gg.length:0};}).sort((a,b)=>b.avgS-a.avgS)[0]; a=`پیلار «${top.p.label}» به‌طور میانگین بهترین عملکرد نسبی را در اکانت شما دارد — تمرکز بیشتر روی آن منطقی است.`; }
    else if(q.includes('رشد این ماه')){ const sorted=list.slice().sort((a,b)=>a.day-b.day); const half=Math.ceil(sorted.length/2); const a1=sorted.slice(0,half), a2=sorted.slice(half); const avgOf=(arr,k)=>arr.length?arr.reduce((s,c)=>s+Number(c.analytics[k]||0),0)/arr.length:0; const r1=avgOf(a1,'reach'), r2=avgOf(a2,'reach'); a= r2>=r1? `ریچ در نیمه‌ی دوم داده‌های ثبت‌شده نسبت به نیمه‌ی اول رشد داشته (${Math.round(r1)} → ${Math.round(r2)}).` : `ریچ در نیمه‌ی دوم نسبت به اول افت داشته (${Math.round(r1)} → ${Math.round(r2)}) — ممکن است به تغییر فرمت یا پیلار محتوا مربوط باشد.`; }
  }
  window._chat.push({q,a}); render();
}

function reportView(){
  const list=withAnalytics(); const avg=accountAvg();
  if(!list.length) return `<div class="card"><h2>گزارش ماهانه</h2><div class="note">برای تولید گزارش، ابتدا آنالیز چند پست را ثبت کنید.</div></div>`;
  const ranked=list.map(c=>({c,s:score(c,avg)})).sort((a,b)=>b.s-a.s);
  const best=ranked.slice(0,3), worst=ranked.slice(-3).reverse();
  const sum=k=>list.reduce((a,c)=>a+Number(c.analytics[k]||0),0);
  const topPillar=PILLARS.map(p=>({p,v:list.filter(c=>c.pillar===p.id).reduce((a,c)=>a+Number(c.analytics.reach||0),0)})).sort((a,b)=>b.v-a.v)[0];
  const topFormat=FORMATS.map(f=>({f,v:list.filter(c=>c.format===f).reduce((a,c)=>a+Number(c.analytics.views||0),0)})).sort((a,b)=>b.v-a.v)[0];
  const patterns=intelPatterns();
  return `<div class="card"><h2>گزارش ماهانه</h2>
    <p class="note"><b>رشد:</b> ${num(sum('follows'))} فالوور جدید از محتوا، ${num(sum('reach'))} مجموع ریچ، ${num(sum('likes')+sum('comments')+sum('saves')+sum('shares'))} تعامل کل.</p>
    <p class="note"><b>بهترین محتوا:</b> ${best.map(b=>b.c.topic).join('، ')}</p>
    <p class="note"><b>ضعیف‌ترین محتوا:</b> ${worst.map(b=>b.c.topic).join('، ')}</p>
    <p class="note"><b>پیلار برتر:</b> ${topPillar.p.label} — <b>فرمت برتر:</b> ${topFormat.f}</p>
    <p class="note"><b>الگوهای کلیدی:</b><br>${patterns.join('<br>')||'—'}</p>
    <p class="note"><b>پیشنهاد آزمایش برای ماه بعد:</b><br>۱. یک محتوای بیشتر در قالب ${topFormat.f} با موضوع «${topPillar.p.label}» بسازید و نتیجه را با میانگین فعلی مقایسه کنید.<br>۲. برای پیلاری با کمترین عملکرد، هوک را تغییر دهید و در تب «آزمایش‌ها» ثبت کنید.</p>
  </div>`;
}

function expView(){
  const e = expEditingId? DATA.experiments.find(x=>x.id===expEditingId) : null;
  const d = e || {hypothesis:'',content:'',date:'',format:FORMATS[0],hook:'',results:'',conclusion:''};
  return `<div class="card"><h2>${e?'ویرایش آزمایش':'آزمایش جدید'}</h2>
    <div class="formgrid" style="grid-template-columns:1fr 1fr;">
      <div><label class="note">فرضیه</label><input type="text" id="e-hyp" value="${esc(d.hypothesis)}"></div>
      <div><label class="note">محتوای استفاده‌شده</label><input type="text" id="e-content" value="${esc(d.content)}"></div>
      <div><label class="note">تاریخ</label><input type="text" id="e-date" value="${esc(d.date)}"></div>
      <div><label class="note">فرمت</label><select id="e-format">${FORMATS.map(f=>`<option ${d.format===f?'selected':''}>${f}</option>`).join('')}</select></div>
      <div><label class="note">هوک</label><input type="text" id="e-hook" value="${esc(d.hook)}"></div>
      <div><label class="note">نتیجه</label><input type="text" id="e-results" value="${esc(d.results)}"></div>
    </div>
    <div><label class="note">جمع‌بندی</label><input type="text" id="e-conclusion" value="${esc(d.conclusion)}"></div>
    <div style="margin-top:10px;"><button onclick="saveExp()">${e?'ذخیره تغییرات':'ثبت آزمایش'}</button>
    ${e?`<button class="ghost" onclick="expEditingId=null;render()">انصراف</button>`:''}</div>
  </div>
  <div class="card"><h2>آزمایش‌های ثبت‌شده (${DATA.experiments.length})</h2>
    <table><tr><th>فرضیه</th><th>محتوا</th><th>تاریخ</th><th>فرمت</th><th>نتیجه</th><th></th></tr>
    ${DATA.experiments.map(x=>`<tr><td>${esc(x.hypothesis)}</td><td>${esc(x.content)}</td><td>${esc(x.date)}</td><td>${x.format}</td><td>${esc(x.results)}</td>
      <td><span class="pillbtn" onclick="expEditingId='${x.id}';render()">✎</span> <span class="pillbtn del" onclick="delExp('${x.id}')">✕</span></td></tr>`).join('')}
    </table>${!DATA.experiments.length?`<div class="note">هنوز آزمایشی ثبت نشده.</div>`:''}
  </div>`;
}
function saveExp(){
  const obj={hypothesis:document.getElementById('e-hyp').value, content:document.getElementById('e-content').value,
    date:document.getElementById('e-date').value, format:document.getElementById('e-format').value,
    hook:document.getElementById('e-hook').value, results:document.getElementById('e-results').value,
    conclusion:document.getElementById('e-conclusion').value};
  if(expEditingId){ Object.assign(DATA.experiments.find(x=>x.id===expEditingId), obj); expEditingId=null; }
  else DATA.experiments.push({id:uid(), ...obj});
  save(); render();
}
function delExp(id){ DATA.experiments=DATA.experiments.filter(x=>x.id!==id); save(); render(); }

render();
</script>
